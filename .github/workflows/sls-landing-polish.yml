name: SLS landing page visual fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sls-landing-polish.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact approved reference composition
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css=r'''
          /* SLS EXACT APPROVED DESIGN V5 */
          .crumb,.page-title,.hero,.section,.shop,.featured{max-width:1520px!important}
          .crumb{padding-left:40px!important;padding-right:40px!important}
          .page-title{font-size:42px!important;min-height:82px!important;display:flex!important;justify-content:center!important;align-items:center!important;gap:14px!important;padding:0 18px 12px!important;color:#075e54!important}
          .page-title .title-logo{width:82px!important;height:72px!important;object-fit:contain!important;display:block!important}
          .hero{height:248px!important;padding:0 28px!important;margin-bottom:18px!important}
          .hero-card{height:100%!important;display:block!important;position:relative!important;overflow:hidden!important;border-radius:24px!important;background:linear-gradient(110deg,#ffe1f0 0%,#e4fff7 47%,#e1f4ff 76%,#fff0aa 100%)!important}
          .hero-card:after{display:none!important}
          .hero-copy{position:absolute!important;left:0!important;top:0!important;width:43%!important;max-width:43%!important;height:100%!important;padding:22px 58px!important;z-index:30!important;display:flex!important;flex-direction:column!important;justify-content:center!important;align-items:flex-start!important}
          .hero-copy small{font-size:13px!important}
          .hero-copy h1{font-size:46px!important;line-height:1.02!important;margin:6px 0 12px!important;color:#075e54!important}
          .hero-copy p{font-size:16px!important;margin:0 0 16px!important;white-space:nowrap!important}
          .hero-copy .primary{font-size:16px!important;padding:12px 22px!important}
          .hero-brand{position:absolute!important;right:0!important;top:0!important;width:57%!important;height:100%!important;z-index:10!important;display:flex!important;align-items:center!important;justify-content:center!important;pointer-events:none!important}
          .hero-visual{width:100%!important;height:100%!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:12px!important;padding:4px 28px 4px 8px!important}
          .hero-products{width:50%!important;height:100%!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:3px!important;flex:none!important;min-width:0!important}
          .hero-product{width:76px!important;height:184px!important;max-width:76px!important;object-fit:contain!important;flex:none!important;filter:drop-shadow(0 8px 8px rgba(0,0,0,.13))!important}
          .hero-logo-wrap{width:190px!important;height:190px!important;flex:none!important;display:flex!important;align-items:center!important;justify-content:center!important}
          .hero-logo-wrap img{width:100%!important;height:100%!important;object-fit:contain!important;display:block!important;filter:drop-shadow(0 5px 5px rgba(0,0,0,.06))!important}
          .hero-slogan{width:135px!important;flex:none!important;color:#075e54!important;font-family:cursive!important;font-size:25px!important;line-height:1.05!important;text-align:center!important;transform:rotate(-3deg)!important}
          .hero-slogan b{display:block!important;font-size:31px!important;margin-top:4px!important}
          .featured{margin-left:auto!important;margin-right:auto!important;padding-left:28px!important;padding-right:28px!important;overflow:hidden!important}
          .feature-row{display:grid!important;grid-template-columns:repeat(6,minmax(0,1fr))!important;gap:16px!important;width:100%!important;min-width:0!important}
          .fcard{min-width:0!important;width:auto!important}
          .fimg{height:145px!important}
          .fname{white-space:normal!important;display:-webkit-box!important;-webkit-box-orient:vertical!important;-webkit-line-clamp:2!important;overflow:hidden!important;line-height:1.2!important;min-height:32px!important}
          @media(max-width:1200px){.hero-copy{width:43%!important;max-width:43%!important;padding-left:42px!important;padding-right:20px!important}.hero-copy h1{font-size:40px!important}.hero-brand{width:57%!important}.hero-visual{gap:7px!important;padding-right:15px!important}.hero-products{width:48%!important}.hero-product{width:62px!important;height:170px!important}.hero-logo-wrap{width:165px!important;height:165px!important}.hero-slogan{width:105px!important;font-size:21px!important}.hero-slogan b{font-size:27px!important}}
          @media(max-width:900px){.hero{height:225px!important;padding:0 18px!important}.hero-copy{width:48%!important;max-width:48%!important;padding:20px 25px!important}.hero-copy h1{font-size:34px!important}.hero-copy p{white-space:normal!important}.hero-brand{width:52%!important}.hero-products{width:43%!important}.hero-product{width:54px!important;height:145px!important}.hero-logo-wrap{width:135px!important;height:135px!important}.hero-slogan{display:none!important}.feature-row{grid-template-columns:repeat(3,minmax(0,1fr))!important}}
          @media(max-width:650px){.page-title{font-size:28px!important;min-height:65px!important}.page-title .title-logo{width:58px!important;height:50px!important}.hero{height:200px!important;padding:0 12px!important}.hero-copy{width:72%!important;max-width:72%!important;padding:15px 16px!important}.hero-copy h1{font-size:29px!important}.hero-copy p{font-size:13px!important}.hero-brand{width:42%!important}.hero-products{display:none!important}.hero-logo-wrap{width:120px!important;height:120px!important}.feature-row{grid-template-columns:repeat(2,minmax(0,1fr))!important}.featured{padding-left:14px!important;padding-right:14px!important}}
          @media(max-width:420px){.hero-copy{width:78%!important;max-width:78%!important}.hero-copy h1{font-size:25px!important}.hero-brand{width:35%!important}.hero-logo-wrap{width:95px!important;height:95px!important}}
          '''
          marker='/* SLS EXACT APPROVED DESIGN V5 */'
          if marker not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          js=r'''
          <!-- SLS EXACT APPROVED DESIGN V5 JS -->
          <script>
          (function(){
            function esc(v){return String(v||'').replace(/"/g,'&quot;')}
            function pick(patterns){
              for(const rx of patterns){
                const p=products.find(x=>rx.test(String(x.name||''))&&x.image);
                if(p)return p;
              }
              return null;
            }
            function render(){
              if(typeof products==='undefined'||!Array.isArray(products)||!products.length)return false;
              const card=document.querySelector('.hero-card');
              if(!card)return false;
              let brand=card.querySelector('.hero-brand');
              if(!brand){brand=document.createElement('div');brand.className='hero-brand';card.appendChild(brand)}
              const picks=[];
              const patterns=[
                [/himalaya.*brightening.*vitamin-c.*orange.*face.*wash/i,/himalaya.*face.*wash/i],
                [/dove.*intense.*repair.*shampoo/i,/dove.*intense.*repair/i],
                [/pond.?s.*bright.*beauty.*cream/i,/pond.?s.*bright.*beauty/i],
                [/tresemme.*keratin.*smooth.*shampoo/i,/tresemme.*580ml/i]
              ];
              patterns.forEach(group=>{const p=pick(group);if(p&&!picks.some(q=>String(q.id)===String(p.id)))picks.push(p)});
              brand.innerHTML='<div class="hero-visual"><div class="hero-products">'+picks.slice(0,4).map(p=>'<img class="hero-product" src="'+esc(p.image)+'" alt="">').join('')+'</div><div class="hero-logo-wrap"><img src="./assets/sls-logo-real.webp?v=approved-v5" alt="SLS Store"></div><div class="hero-slogan">Better Care<b>Brighter You</b>♡</div></div>';
              return true;
            }
            function wait(){if(!render())setTimeout(wait,700)}
            if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',wait);else wait();
          })();
          </script>
          '''
          if '<!-- SLS EXACT APPROVED DESIGN V5 JS -->' not in s:
              s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'SLS Store Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo no-changes; else git commit -m 'Match SLS landing page to exact approved design'; git push; fi
