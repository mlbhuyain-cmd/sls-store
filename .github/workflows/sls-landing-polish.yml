name: SLS landing page visual fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sls-landing-polish.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tighten approved hero product lineup
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''
          <style id="sls-reference-v6">
          .hero-products{gap:0!important;align-items:flex-end!important;justify-content:center!important;position:relative!important;padding-bottom:12px!important}
          .hero-product{width:82px!important;height:182px!important;flex:0 0 82px!important;margin:0 -9px!important;object-fit:contain!important;mix-blend-mode:multiply!important;filter:drop-shadow(0 7px 6px rgba(0,0,0,.13))!important;position:relative!important;z-index:2!important}
          .hero-products:after{content:""!important;position:absolute!important;left:8%!important;right:4%!important;bottom:8px!important;height:28px!important;border-radius:50%!important;background:linear-gradient(#ffd8eb,#df9dcc)!important;box-shadow:0 5px 8px #0002!important;z-index:1!important}
          .hero-brand{width:60%!important}
          .hero-visual{gap:4px!important;padding-right:18px!important}
          .hero-logo-wrap{width:178px!important;height:178px!important;margin-left:4px!important;flex:none!important}
          .hero-slogan{width:132px!important;font-size:24px!important;line-height:1.02!important}
          .hero-slogan b{font-size:30px!important}
          @media(max-width:1200px){.hero-product{width:68px!important;height:165px!important;flex-basis:68px!important;margin:0 -7px!important}.hero-logo-wrap{width:155px!important;height:155px!important}.hero-slogan{width:105px!important;font-size:20px!important}.hero-slogan b{font-size:25px!important}}
          @media(max-width:900px){.hero-brand{width:52%!important}.hero-product{width:53px!important;height:145px!important;flex-basis:53px!important;margin:0 -5px!important}.hero-logo-wrap{width:130px!important;height:130px!important}.hero-slogan{display:none!important}}
          </style>
          '''
          if 'sls-reference-v6' not in s:s=s.replace('</head>',css+'</head>',1)
          js='''
          <script id="sls-reference-products-v6">
          (function(){
            function pick(rx){return products.find(x=>rx.test(String(x.name||''))&&x.image)}
            function go(){
              if(typeof products==='undefined'||!Array.isArray(products)||!products.length)return setTimeout(go,600);
              var c=document.querySelector('.hero-card'); if(!c)return setTimeout(go,600);
              var b=c.querySelector('.hero-brand'); if(!b){b=document.createElement('div');b.className='hero-brand';c.appendChild(b)}
              var r=[/himalaya.*purifying.*neem.*face.*wash.*100ml/i,/dove.*intense.*repair.*conditioner.*180ml/i,/pond.?s.*bright.*beauty.*face.*wash.*100gm/i,/tresemme.*hd.*hair.*fall.*defense.*580ml/i];
              var f=[/himalaya.*face.*wash/i,/dove.*intense.*repair/i,/pond.?s.*bright.*beauty/i,/tresemme.*580ml/i],a=[];
              r.forEach(function(x,i){var p=pick(x)||pick(f[i]);if(p&&!a.some(function(q){return String(q.id)===String(p.id)}))a.push(p)});
              b.innerHTML='<div class="hero-visual"><div class="hero-products">'+a.slice(0,4).map(function(p){return '<img class="hero-product" src="'+p.image+'" alt="">'}).join('')+'</div><div class="hero-logo-wrap"><img src="./assets/sls-logo-real.webp?v=v6" alt="SLS Store"></div><div class="hero-slogan">Better Care<b>Brighter You</b>♡</div></div>';
            }
            go();
          })();
          </script>
          '''
          if 'sls-reference-products-v6' not in s:s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'SLS Store Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Tighten hero product lineup' && git push)
