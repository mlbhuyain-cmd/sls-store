name: SLS landing page visual fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sls-landing-polish.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scale all hero combo products up uniformly
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''
          <style id="sls-hero-all-products-big-v11">
          .hero-products{width:68%!important;height:100%!important;display:flex!important;align-items:flex-end!important;justify-content:center!important;gap:0!important;padding:0 6px 5px!important;overflow:visible!important;position:relative!important}
          .hero-product{width:118px!important;height:310px!important;flex:0 0 118px!important;margin:0 -24px!important;object-fit:contain!important;transform:scale(1.22)!important;transform-origin:center bottom!important;mix-blend-mode:multiply!important;filter:drop-shadow(0 10px 8px rgba(0,0,0,.14))!important;z-index:3!important}
          .hero-products:after{left:0!important;right:0!important;bottom:4px!important;height:34px!important;border-radius:50%!important;z-index:1!important}
          .hero-logo-wrap{width:190px!important;height:190px!important;flex:0 0 190px!important;margin:0 0!important}
          .hero-slogan{width:122px!important;flex:0 0 122px!important;font-size:23px!important}
          .hero-slogan b{font-size:30px!important}
          @media(max-width:1250px){.hero-products{width:66%!important}.hero-product{width:104px!important;height:285px!important;flex-basis:104px!important;margin:0 -21px!important;transform:scale(1.18)!important}.hero-logo-wrap{width:170px!important;height:170px!important;flex-basis:170px!important}.hero-slogan{width:100px!important;flex-basis:100px!important;font-size:20px!important}.hero-slogan b{font-size:26px!important}}
          @media(max-width:1000px){.hero-products{width:62%!important}.hero-product{width:84px!important;height:250px!important;flex-basis:84px!important;margin:0 -16px!important;transform:scale(1.13)!important}.hero-logo-wrap{width:150px!important;height:150px!important;flex-basis:150px!important}.hero-slogan{display:none!important}}
          @media(max-width:700px){.hero-products{width:100%!important}.hero-product{width:62px!important;height:205px!important;flex-basis:62px!important;margin:0 -11px!important;transform:scale(1.08)!important}.hero-logo-wrap{display:none!important}}
          </style>
          '''
          if 'sls-hero-all-products-big-v11' not in s:s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'SLS Store Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Scale all hero combo products up uniformly' && git push)
