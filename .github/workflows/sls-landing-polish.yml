name: SLS landing page visual fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sls-landing-polish.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make marked hero product area fully filled
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''
          <style id="sls-hero-marked-area-full-v14">
          /* The red-marked middle box: products themselves fill the whole area. */
          .hero-brand{width:64%!important;right:0!important;top:0!important;height:100%!important}
          .hero-visual{width:100%!important;height:100%!important;display:flex!important;align-items:center!important;justify-content:flex-start!important;gap:0!important;padding:0!important;overflow:visible!important}
          .hero-products{width:74%!important;height:100%!important;display:flex!important;align-items:flex-end!important;justify-content:center!important;gap:0!important;padding:0 0 5px!important;overflow:visible!important;position:relative!important;flex:none!important;min-width:0!important}
          .hero-product{width:128px!important;height:292px!important;max-width:none!important;flex:0 0 128px!important;flex-shrink:0!important;margin:0 -52px!important;object-fit:contain!important;transform:none!important;transform-origin:center bottom!important;mix-blend-mode:multiply!important;filter:drop-shadow(0 10px 8px rgba(0,0,0,.16))!important;position:relative!important;z-index:4!important}
          .hero-products:after{left:2%!important;right:2%!important;bottom:4px!important;height:30px!important;border-radius:50%!important;z-index:1!important}
          .hero-logo-wrap{width:175px!important;height:175px!important;flex:0 0 175px!important;margin:0!important;z-index:5!important}
          .hero-slogan{width:105px!important;flex:0 0 105px!important;font-size:22px!important}
          .hero-slogan b{font-size:28px!important}
          @media(max-width:1250px){.hero-brand{width:63%!important}.hero-products{width:73%!important}.hero-product{width:112px!important;height:275px!important;flex-basis:112px!important;margin:0 -46px!important}.hero-logo-wrap{width:160px!important;height:160px!important;flex-basis:160px!important}.hero-slogan{width:90px!important;flex-basis:90px!important;font-size:19px!important}.hero-slogan b{font-size:24px!important}}
          @media(max-width:1000px){.hero-brand{width:61%!important}.hero-products{width:72%!important}.hero-product{width:92px!important;height:235px!important;flex-basis:92px!important;margin:0 -38px!important}.hero-logo-wrap{width:140px!important;height:140px!important;flex-basis:140px!important}.hero-slogan{display:none!important}}
          @media(max-width:700px){.hero-brand{width:48%!important}.hero-products{width:100%!important}.hero-product{width:64px!important;height:190px!important;flex-basis:64px!important;margin:0 -18px!important}.hero-logo-wrap{display:none!important}}
          </style>
          '''
          if 'sls-hero-marked-area-full-v14' not in s:s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'SLS Store Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Make marked hero product area fully filled' && git push)
