name: SLS landing page polish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe visual patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* SLS professional landing polish v2 */'
          css=r'''\n/* SLS professional landing polish v2 */
.hero-card{position:relative;overflow:hidden;isolation:isolate}
.hero-card:after{content:"";position:absolute;right:28px;top:18px;width:340px;height:180px;background:url('./assets/sls-logo-hd.webp?v=landing2') center/contain no-repeat;filter:drop-shadow(0 12px 22px rgba(7,94,84,.16));z-index:0;pointer-events:none}
.hero-copy{position:relative;z-index:1;max-width:62%}
.featured{overflow:hidden;box-shadow:0 16px 42px rgba(7,94,84,.08)}
.feature-row{grid-template-columns:repeat(6,minmax(0,1fr))!important;min-width:0!important;width:100%!important;overflow:hidden!important}
.fcard{min-width:0!important;width:auto!important;overflow:hidden!important;box-shadow:0 8px 22px rgba(20,50,79,.07);transition:transform .2s ease,box-shadow .2s ease}
.fcard:hover{transform:translateY(-4px);box-shadow:0 14px 28px rgba(20,50,79,.13)}
.fname{white-space:normal!important;display:-webkit-box!important;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;min-height:33px;line-height:1.25}
.fimg{min-width:0;overflow:hidden}
.page-title{letter-spacing:.2px}
@media(max-width:1000px){.hero-card:after{width:270px;height:150px;right:15px}.hero-copy{max-width:65%}.feature-row{grid-template-columns:repeat(3,minmax(0,1fr))!important}}
@media(max-width:700px){.hero-card:after{width:150px;height:110px;right:8px;top:10px;opacity:.9}.hero-copy{max-width:78%;padding-right:10px}.feature-row{grid-template-columns:repeat(2,minmax(0,1fr))!important;display:grid!important}.fcard{min-width:0!important}}
@media(max-width:480px){.hero-card:after{width:110px;height:85px;right:4px;top:12px}.hero-copy{max-width:84%}}
'''
          if marker not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          # Keep the centered page heading, but make it feel like a branded landing page.
          title_pat=r'<h1 class="page-title" id="pageTitle">SLS Store</h1>'
          title_rep='<h1 class="page-title" id="pageTitle"><span style="display:inline-flex;align-items:center;justify-content:center;gap:10px"><img src="./assets/sls-logo-hd.webp?v=landing2" alt="SLS Store Logo" style="height:48px;width:120px;object-fit:contain;vertical-align:middle"> <span>SLS Store</span></span></h1>'
          if re.search(title_pat,s):
              s=re.sub(title_pat,title_rep,s,count=1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'SLS Store Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then git commit -m 'Polish SLS professional landing page layout'; git push; fi
          rm -f .github/workflows/sls-landing-polish.yml
          git add .github/workflows/sls-landing-polish.yml
          git commit -m 'Remove temporary landing polish workflow' || true
          git push || true
