name: SLS landing page visual fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sls-landing-polish.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fill highlighted hero area with large product combo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''
          <style id="sls-hero-fill-highlight-v13">
          /* Fill the entire highlighted middle hero area with a large, tight 8-product combo. */
          .hero-brand{width:64%!important;right:0!important;top:0!important;height:100%!important}
          .hero-visual{width:100%!important;height:100%!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:0!important;padding:0 10px 0 0!important;overflow:visible!important}
          .hero-products{width:70%!important;height:100%!important;display:flex!important;align-items:flex-end!important;justify-content:center!important;gap:0!important;padding:0 0 8px!important;overflow:visible!important;position:relative!important;flex:none!important}
          .hero-product{width:110px!important;height:250px!important;flex:0 0 110px!important;margin:0 -20px!important;object-fit:contain!important;transform:none!important;transform-origin:center bottom!important;mix-blend-mode:multiply!important;filter:drop-shadow(0 9px 8px rgba(0,0,0,.15))!important;position:relative!important;z-index:4!important;max-width:none!important}
          .hero-products:after{left:0!important;right:0!important;bottom:5px!important;height:30px!important;border-radius:50%!important;z-index:1!important}
          .hero-logo-wrap{width:175px!important;height:175px!important;flex:0 0 175px!important;margin:0!important;z-index:5!important}
          .hero-slogan{width:105px!important;flex:0 0 105px!important;font-size:22px!important}
          .hero-slogan b{font-size:28px!important}
          @media(max-width:1250px){.hero-brand{width:62%!important}.hero-products{width:68%!important}.hero-product{width:96px!important;height:225px!important;flex-basis:96px!important;margin:0 -17px!important}.hero-logo-wrap{width:160px!important;height:160px!important;flex-basis:160px!important}.hero-slogan{width:92px!important;flex-basis:92px!important;font-size:19px!important}.hero-slogan b{font-size:24px!important}}
          @media(max-width:1000px){.hero-brand{width:60%!important}.hero-products{width:67%!important}.hero-product{width:78px!important;height:200px!important;flex-basis:78px!important;margin:0 -14px!important}.hero-logo-wrap{width:140px!important;height:140px!important;flex-basis:140px!important}.hero-slogan{display:none!important}}
          @media(max-width:700px){.hero-brand{width:48%!important}.hero-products{width:100%!important}.hero-product{width:58px!important;height:170px!important;flex-basis:58px!important;margin:0 -10px!important}.hero-logo-wrap{display:none!important}}
          </style>
          '''
          if 'sls-hero-fill-highlight-v13' not in s:s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'SLS Store Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Fill highlighted hero area with large product combo' && git push)
