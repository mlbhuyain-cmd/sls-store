name: SLS landing page visual fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sls-landing-polish.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final combined product showcase
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''
          <style id="sls-combo-showcase-v7">
          .hero{height:292px!important}
          .hero-card{height:100%!important}
          .hero-brand{width:62%!important;height:100%!important;right:0!important}
          .hero-visual{height:100%!important;gap:2px!important;padding:0 14px 0 0!important;align-items:center!important}
          .hero-products{width:58%!important;height:100%!important;display:flex!important;align-items:flex-end!important;justify-content:center!important;gap:0!important;padding:0 0 10px!important;position:relative!important}
          .hero-product{width:78px!important;height:232px!important;flex:0 0 78px!important;margin:0 -10px!important;object-fit:contain!important;mix-blend-mode:multiply!important;filter:drop-shadow(0 8px 7px rgba(0,0,0,.15))!important;position:relative!important;z-index:3!important}
          .hero-products:after{content:""!important;position:absolute!important;left:5%!important;right:2%!important;bottom:8px!important;height:30px!important;border-radius:50%!important;background:linear-gradient(#ffd8eb,#d992bf)!important;box-shadow:0 6px 10px rgba(0,0,0,.18)!important;z-index:1!important}
          .hero-logo-wrap{width:188px!important;height:188px!important;flex:0 0 188px!important;margin:0!important;display:flex!important;align-items:center!important;justify-content:center!important;z-index:4!important}
          .hero-logo-wrap img{width:100%!important;height:100%!important;object-fit:contain!important}
          .hero-slogan{width:125px!important;flex:0 0 125px!important;font-size:25px!important;line-height:1.02!important;text-align:center!important;color:#075e54!important}
          .hero-slogan b{font-size:31px!important;display:block!important}
          @media(max-width:1250px){.hero-products{width:56%!important}.hero-product{width:67px!important;height:215px!important;flex-basis:67px!important;margin:0 -9px!important}.hero-logo-wrap{width:170px!important;height:170px!important;flex-basis:170px!important}.hero-slogan{width:100px!important;flex-basis:100px!important;font-size:21px!important}.hero-slogan b{font-size:27px!important}}
          @media(max-width:1000px){.hero{height:260px!important}.hero-brand{width:58%!important}.hero-products{width:55%!important}.hero-product{width:56px!important;height:195px!important;flex-basis:56px!important;margin:0 -7px!important}.hero-logo-wrap{width:145px!important;height:145px!important;flex-basis:145px!important}.hero-slogan{display:none!important}}
          @media(max-width:700px){.hero{height:230px!important}.hero-copy{width:58%!important;max-width:58%!important;padding:18px 18px!important}.hero-copy h1{font-size:31px!important}.hero-brand{width:48%!important}.hero-products{display:none!important}.hero-logo-wrap{width:130px!important;height:130px!important;flex-basis:130px!important}}
          </style>
          '''
          if 'sls-combo-showcase-v7' not in s:s=s.replace('</head>',css+'</head>',1)
          js='''
          <script id="sls-combo-products-v7">
          (function(){
            function pick(rx){return products.find(function(x){return rx.test(String(x.name||''))&&x.image})}
            function go(){
              if(typeof products==='undefined'||!Array.isArray(products)||!products.length)return setTimeout(go,600);
              var c=document.querySelector('.hero-card'); if(!c)return setTimeout(go,600);
              var b=c.querySelector('.hero-brand'); if(!b){b=document.createElement('div');b.className='hero-brand';c.appendChild(b)}
              var rx=[
                /himalaya.*purifying.*neem.*face.*wash.*100ml/i,
                /dove.*intense.*repair.*conditioner.*180ml/i,
                /pond.?s.*bright.*beauty.*face.*wash.*100gm/i,
                /tresemme.*hd.*hair.*fall.*defense.*580ml/i,
                /clear.*men.*cool.*sport.*menthol.*450/i,
                /himalaya.*natural.*glow.*saffron.*face.*cream.*50gm/i,
                /pond.?s.*bright.*beauty.*cream.*50gm/i,
                /himalaya.*brightening.*vitamin-c.*orange.*face.*wash.*100ml/i
              ];
              var fall=[/himalaya.*face.*wash/i,/dove.*intense.*repair/i,/pond.?s.*bright.*beauty/i,/tresemme.*580ml/i,/clear.*shampoo/i,/himalaya.*cream/i,/pond.?s.*cream/i,/himalaya.*brightening/i];
              var a=[];
              rx.forEach(function(r,i){var p=pick(r)||pick(fall[i]);if(p&&!a.some(function(q){return String(q.id)===String(p.id)}))a.push(p)});
              b.innerHTML='<div class="hero-visual"><div class="hero-products">'+a.slice(0,8).map(function(p){return '<img class="hero-product" src="'+p.image+'" alt="">'}).join('')+'</div><div class="hero-logo-wrap"><img src="./assets/sls-logo-real.webp?v=v7" alt="SLS Store"></div><div class="hero-slogan">Better Care<b>Brighter You</b>♡</div></div>';
            }
            go();
          })();
          </script>
          '''
          if 'sls-combo-products-v7' not in s:s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'SLS Store Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Create larger combined beauty product showcase' && git push)
