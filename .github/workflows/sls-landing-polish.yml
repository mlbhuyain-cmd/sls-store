name: SLS landing page visual fix
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sls-landing-polish.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply final visual fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* SLS FINAL LANDING LOGO FEATURED FIX */'
          css='''\n/* SLS FINAL LANDING LOGO FEATURED FIX */\n.top .logo{width:76px!important;height:58px!important;object-fit:contain!important;display:block!important}\n.brand-title{max-width:1150px;margin:0 auto;padding:4px 18px 14px;display:flex!important;justify-content:center!important;align-items:center!important}\n.brand-title img{width:180px;height:72px;object-fit:contain;display:block}\n.hero-card{position:relative!important;overflow:hidden!important;isolation:isolate!important}\n.hero-card:after{content:"";position:absolute;right:25px;top:50%;transform:translateY(-50%);width:330px;height:175px;background:url('./assets/sls-logo-hd.webp?v=final2') center/contain no-repeat;z-index:2;pointer-events:none}\n.hero-copy{position:relative;z-index:3;max-width:60%}\n.featured{overflow:hidden!important}\n.feature-row{display:grid!important;grid-template-columns:repeat(6,minmax(0,1fr))!important;gap:12px!important;width:100%!important;min-width:0!important;overflow:hidden!important}\n.fcard{min-width:0!important;width:auto!important;overflow:hidden!important}\n.fimg{min-width:0!important;width:100%!important;overflow:hidden!important}\n.fname{white-space:normal!important;display:-webkit-box!important;-webkit-box-orient:vertical!important;-webkit-line-clamp:2!important;overflow:hidden!important;line-height:1.25!important;min-height:33px!important}\n@media(max-width:1000px){.top .logo{width:68px!important;height:54px!important}.brand-title img{width:155px;height:64px}.hero-card:after{width:250px;height:135px;right:15px}.hero-copy{max-width:63%}.feature-row{grid-template-columns:repeat(3,minmax(0,1fr))!important}}\n@media(max-width:700px){.top .logo{width:60px!important;height:50px!important}.brand-title img{width:140px;height:58px}.hero-card:after{width:145px;height:105px;right:8px}.hero-copy{max-width:78%}.feature-row{grid-template-columns:repeat(2,minmax(0,1fr))!important}}\n@media(max-width:450px){.brand-title img{width:125px;height:54px}.hero-card:after{width:105px;height:80px;right:4px}.hero-copy{max-width:82%}}\n'''
          if marker not in s:
              s=s.replace('</style>',css+'\n</style>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit final page
        run: |
          git config user.name 'SLS Store Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo 'No visual changes'; else git commit -m 'Fix SLS company logo and featured product overflow'; git push; fi
