name: SLS landing page visual fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sls-landing-polish.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply balanced large product combo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''
          <style id="sls-uniform-combo-v9">
          .hero-products{align-items:flex-end!important;justify-content:center!important;gap:0!important;overflow:visible!important}
          .hero-product{width:92px!important;height:250px!important;flex:0 0 92px!important;margin:0 -15px!important;object-fit:contain!important;transform:scale(1.18)!important;transform-origin:center bottom!important;mix-blend-mode:multiply!important;filter:drop-shadow(0 8px 7px rgba(0,0,0,.14))!important;z-index:3!important}
          .hero-products:after{left:2%!important;right:1%!important;bottom:7px!important;height:30px!important;z-index:1!important}
          .hero-logo-wrap{width:184px!important;height:184px!important;flex-basis:184px!important}
          .hero-slogan{width:120px!important;flex-basis:120px!important}
          @media(max-width:1250px){.hero-product{width:80px!important;height:230px!important;flex-basis:80px!important;margin:0 -13px!important;transform:scale(1.14)!important}.hero-logo-wrap{width:165px!important;height:165px!important;flex-basis:165px!important}}
          @media(max-width:1000px){.hero-product{width:68px!important;height:205px!important;flex-basis:68px!important;margin:0 -10px!important;transform:scale(1.1)!important}.hero-logo-wrap{width:145px!important;height:145px!important;flex-basis:145px!important}}
          </style>
          '''
          if 'sls-uniform-combo-v9' not in s:s=s.replace('</head>',css+'</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'SLS Store Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || (git commit -m 'Make hero product combo uniformly large and balanced' && git push)
