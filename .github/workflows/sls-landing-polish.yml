name: SLS landing page visual fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sls-landing-polish.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reference design
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          css='''
          /* SLS APPROVED REFERENCE */
          .crumb,.page-title,.hero,.section,.shop,.featured{max-width:1520px!important}
          .crumb{padding-left:40px!important}
          .page-title{font-size:42px!important;min-height:82px!important;display:flex!important;justify-content:center!important;align-items:center!important;gap:14px!important}
          .page-title .title-logo{width:82px!important;height:72px!important;object-fit:contain!important}
          .hero{height:248px!important;padding:0 28px!important}
          .hero-card{display:block!important;position:relative!important;overflow:hidden!important}
          .hero-copy{position:absolute!important;left:0!important;top:0!important;width:42%!important;max-width:42%!important;height:100%!important;padding:22px 60px!important;z-index:10!important;display:flex!important;flex-direction:column!important;justify-content:center!important;align-items:flex-start!important}
          .hero-copy h1{font-size:46px!important;line-height:1.02!important;margin:6px 0 12px!important}
          .hero-copy p{white-space:nowrap!important}
          .hero-brand{position:absolute!important;right:0!important;top:0!important;width:60%!important;height:100%!important;z-index:5!important;display:flex!important;align-items:center!important;justify-content:center!important}
          .hero-visual{width:100%!important;height:100%!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:16px!important;padding-right:28px!important}
          .hero-products{width:52%!important;height:100%!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:4px!important}
          .hero-product{width:82px!important;height:190px!important;object-fit:contain!important;filter:drop-shadow(0 7px 7px rgba(0,0,0,.12))!important}
          .hero-logo-wrap{width:190px!important;height:190px!important;flex:none!important}
          .hero-logo-wrap img{width:100%!important;height:100%!important;object-fit:contain!important}
          .hero-slogan{width:145px!important;color:#075e54!important;font-family:cursive!important;font-size:25px!important;line-height:1.05!important;text-align:center!important;transform:rotate(-3deg)!important}
          .hero-slogan b{display:block!important;font-size:31px!important}
          .featured{margin-left:auto!important;margin-right:auto!important;padding-left:28px!important;padding-right:28px!important}
          .feature-row{grid-template-columns:repeat(6,minmax(0,1fr))!important;gap:16px!important}
          .fimg{height:145px!important}
          @media(max-width:900px){.hero{height:225px!important}.hero-copy{width:47%!important;max-width:47%!important;padding:20px 25px!important}.hero-copy h1{font-size:34px!important}.hero-brand{width:53%!important}.hero-products{width:43%!important}.hero-product{width:55px!important;height:145px!important}.hero-logo-wrap{width:135px!important;height:135px!important}.hero-slogan{display:none!important}.feature-row{grid-template-columns:repeat(3,minmax(0,1fr))!important}}
          @media(max-width:650px){.page-title{font-size:28px!important;min-height:65px!important}.page-title .title-logo{width:58px!important;height:50px!important}.hero{height:200px!important;padding:0 12px!important}.hero-copy{width:72%!important;max-width:72%!important;padding:15px!important}.hero-copy h1{font-size:29px!important}.hero-brand{width:42%!important}.hero-products{display:none!important}.hero-logo-wrap{width:120px!important;height:120px!important}.feature-row{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
          '''
          marker='/* SLS APPROVED REFERENCE */'
          if marker not in s: s=s.replace('</style>',css+'\n</style>',1)
          js='''
          <script>
          (function(){function go(){if(typeof products==='undefined'||!Array.isArray(products)||!products.length)return setTimeout(go,700);var c=document.querySelector('.hero-card');if(!c)return;var b=c.querySelector('.hero-brand')||document.createElement('div');b.className='hero-brand';b.innerHTML='<div class="hero-visual"><div class="hero-products"></div><div class="hero-logo-wrap"><img src="./assets/sls-logo-real.webp?v=ref" alt="SLS Store"></div><div class="hero-slogan">Better Care<b>Brighter You</b>♡</div></div>';c.appendChild(b);var rx=[/himalaya.*purifying.*neem.*100ml/i,/dove.*intense.*repair.*650ml/i,/pond.?s.*bright.*beauty/i,/tresemme.*580ml/i];b.querySelector('.hero-products').innerHTML=rx.map(function(r){return products.find(function(p){return r.test(String(p.name||''))&&p.image})}).filter(Boolean).slice(0,4).map(function(p){return '<img class="hero-product" src="'+String(p.image).replace(/"/g,'&quot;')+'" alt="">'}).join('')}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',go);else go()})();
          </script>
          '''
          if 'SLS APPROVED REFERENCE JS' not in s:s=s.replace('</body>','<!-- SLS APPROVED REFERENCE JS -->'+js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'SLS Store Bot'; git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then echo no-changes; else git commit -m 'Match approved SLS landing reference'; git push; fi
