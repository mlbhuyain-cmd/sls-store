name: Repair SLS Store UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch site
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          patch=r'''<style id="sls-repair-css">
          .modal .close{z-index:99999!important;pointer-events:auto!important;cursor:pointer!important}
          #placeOrder{position:relative;z-index:5;pointer-events:auto!important}
          </style>
          <script id="sls-repair-js">
          (function(){
            function close(id){var e=document.getElementById(id);if(e)e.classList.remove('show');}
            function bind(){document.querySelectorAll('.modal .close[data-close]').forEach(function(b){b.onclick=function(e){e.preventDefault();e.stopPropagation();close(b.getAttribute('data-close'));};});}
            document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('.modal .close[data-close]');if(b){e.preventDefault();e.stopImmediatePropagation();close(b.getAttribute('data-close'));}},true);
            document.addEventListener('DOMContentLoaded',bind);setTimeout(bind,300);setTimeout(bind,1000);
            window.closeModal=close;
            var old=document.getElementById('placeOrder');if(old){old.type='button';old.addEventListener('click',function(){old.disabled=false;},true);}
          })();
          </script>'''
          if 'id="sls-repair-js"' not in s:
              s=s.replace('</body>',patch+'\n</body>')
          p.write_text(s,encoding='utf-8')
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Repair checkout and modal controls" || exit 0
          git push
      - name: Remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/site-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/site-repair.yml
          git commit -m "Remove temporary repair workflow" || exit 0
          git push
